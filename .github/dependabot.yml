version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@actions/*"
      - dependency-name: adm-zip
      - dependency-name: yaml
    groups:
      release-tooling:
        patterns: ["*"]
